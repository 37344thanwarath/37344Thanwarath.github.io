<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thanwarath | Home</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(255, 182, 211, 0.65),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 214, 231, 0.75),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #fff4f8,
                    #ffe5ef,
                    #fff8fb
                );

            color: #70445a;

            line-height: 1.7;

            min-height: 100vh;

            position: relative;

            overflow-x: hidden;
        }


        /* ===== ของตกแต่งพื้นหลัง ===== */

        body::before {
            content: "♡  🎀  ♡  ✿  ♡  🎀  ♡";

            position: fixed;

            top: 90px;
            left: 0;

            width: 100%;

            text-align: center;

            color: rgba(238, 132, 172, 0.18);

            font-size: 25px;

            letter-spacing: 12px;

            pointer-events: none;

            z-index: -1;
        }


        body::after {
            content: "♡";

            position: fixed;

            right: 7%;
            bottom: 8%;

            color: rgba(231, 111, 157, 0.18);

            font-size: 90px;

            transform: rotate(-15deg);

            pointer-events: none;

            z-index: -1;
        }


        /* ===== Navigation ===== */

        nav {
            position: sticky;

            top: 0;

            z-index: 100;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 8%;

            background: rgba(255, 255, 255, 0.90);

            backdrop-filter: blur(12px);

            border-bottom: 2px solid #f5b4ce;

            box-shadow:
                0 5px 20px
                rgba(220, 110, 155, 0.10);
        }


        .logo {
            font-size: 22px;

            font-weight: bold;

            color: #df6f9f;

            text-shadow:
                0 2px 8px
                rgba(223, 111, 159, 0.18);
        }


        .logo::before {
            content: "🎀 ";
        }


        nav a {
            color: #c65d89;

            text-decoration: none;

            margin-left: 20px;

            font-weight: bold;

            transition: 0.3s;
        }


        nav a:hover {
            color: #ec6fa5;

            transform: translateY(-2px);
        }


        /* ===== Main Content ===== */

        .container {
            max-width: 900px;

            margin: auto;

            padding: 80px 20px;
        }


        /* ===== Welcome Box ===== */

        .welcome {
            position: relative;

            background:
                linear-gradient(
                    rgba(255,255,255,0.94),
                    rgba(255,248,251,0.94)
                );

            border: 2px solid #f2b4cd;

            padding: 55px 35px;

            border-radius: 24px;

            box-shadow:
                0 15px 40px
                rgba(220, 110, 155, 0.15);

            text-align: center;

            overflow: hidden;
        }


        .welcome::before {
            content: "";

            position: absolute;

            inset: 10px;

            border: 2px dashed #f6c1d7;

            border-radius: 18px;

            pointer-events: none;
        }


        .welcome::after {
            content: "🎀";

            position: absolute;

            right: 22px;

            top: 12px;

            font-size: 32px;

            transform: rotate(8deg);
        }


        .number {
            display: inline-block;

            color: #e36f9e;

            font-family: monospace;

            font-weight: bold;

            background: #ffd6e6;

            padding: 5px 12px;

            border-radius: 50px;

            margin-bottom: 20px;

            position: relative;

            z-index: 2;
        }


        h1 {
            font-size: 42px;

            color: #703f56;

            position: relative;

            z-index: 2;

            margin-bottom: 15px;
        }


        h1::after {
            content: " ♡";

            color: #ed83ad;

            font-size: 28px;
        }


        .welcome p {
            color: #806274;

            font-size: 18px;

            position: relative;

            z-index: 2;

            margin-bottom: 30px;
        }


        /* ===== Menu ===== */

        .menu {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            position: relative;

            z-index: 5;
        }


        .menu a {
            display: block;

            min-width: 150px;

            padding: 15px 22px;

            background:
                linear-gradient(
                    135deg,
                    #fff,
                    #fff0f6
                );

            border: 2px solid #f1aec9;

            border-radius: 18px;

            color: #c65d89;

            text-decoration: none;

            font-weight: bold;

            text-align: center;

            box-shadow:
                0 8px 20px
                rgba(220, 110, 155, 0.14);

            transition: all 0.3s ease;
        }


        .menu a:hover {
            transform: translateY(-5px);

            background:
                linear-gradient(
                    135deg,
                    #fff,
                    #ffdce9
                );

            border-color: #e978a5;

            color: #b94d7d;

            box-shadow:
                0 14px 30px
                rgba(220, 110, 155, 0.23);
        }


        /* ===== Footer ===== */

        footer {
            text-align: center;

            padding: 40px 20px;

            border-top: 2px solid #f3bdd2;

            color: #a4778b;

            font-size: 13px;

            background: rgba(255,255,255,0.35);
        }


        footer::before {
            content: "♡  🎀  ♡  🐱  ♡  🎀  ♡";

            display: block;

            color: #e982ad;

            font-size: 18px;

            margin-bottom: 10px;

            letter-spacing: 5px;
        }


        /* ===== Mobile ===== */

        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;
            }


            nav div:last-child {
                display: none;
            }


            .container {
                padding: 55px 15px;
            }


            .welcome {
                padding: 45px 20px;
            }


            h1 {
                font-size: 30px;
            }


            .welcome p {
                font-size: 16px;
            }


            .menu {
                flex-direction: column;

                gap: 12px;
            }


            .menu a {
                width: 100%;

                max-width: none;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            Thanwarath.
        </div>


        <div>

            <a href="index.html">
                Home
            </a>

            <!-- แก้เป็นชื่อไฟล์จริง -->
            <a href="introduction.html">
                คำนำ
            </a>

            <a href="about.html">
                About Me
            </a>

            <a href="portfolio.html">
                Portfolio
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container">

        <section class="welcome">

            <div class="number">
                00.
            </div>


            <h1>
                Welcome to My Portfolio
            </h1>


            <p>
                ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงานของ Thanwarath
            </p>


            <div class="menu">

                <!-- คำนำ -->
                <a href="introduction.html">
                    ♡ คำนำ
                </a>


                <!-- About Me -->
                <a href="about.html">
                    ♡ About Me
                </a>


                <!-- Portfolio -->
                <a href="portfolio.html">
                    ♡ Portfolio
                </a>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            Designed & Built by
            <strong>Thanwarath</strong>
        </p>


        <p>
            © 2026 Thanwarath
        </p>

    </footer>


</body>

</html>
