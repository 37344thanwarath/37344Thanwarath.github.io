<!-- หน้าแรก -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Tanitta | Portfolio</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background:
            radial-gradient(
                circle at top,
                #ffe0ed 0%,
                #fff0f6 45%,
                #fff8fb 100%
            );
        color: #6b4055;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }
    /* ===== Card ===== */
    .card {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.88);
        border: 2px solid #f3b6cf;
        border-radius: 24px;
        padding: 50px 35px;
        text-align: center;
        box-shadow:
            0 20px 60px
            rgba(220, 120, 160, 0.20),
            0 5px 25px
            rgba(240, 160, 190, 0.12);
        transition: 0.3s;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow:
            0 25px 70px
            rgba(220, 120, 160, 0.35);
    }
    /* ===== รูปโปรไฟล์ ===== */
    .profile-wrap {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 25px;
        animation: profileFloat 4s ease-in-out infinite;
    }
    .profile {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid #f3b6cf;
        box-shadow:
            0 0 0 6px #fff0f6,
            0 0 30px rgba(220, 120, 160, 0.3);
        transition: 0.3s;
        display: block;
    }
    .profile:hover {
        transform: scale(1.05);
    }
    /* ===== วงกลมเส้นประรอบรูป ===== */
    .profile-wrap::before {
        content: "";
        position: absolute;
        width: 172px;
        height: 172px;
        top: -11px;
        left: -11px;
        border: 2px dashed rgba(225, 123, 168, 0.45);
        border-radius: 50%;
        animation: spin 12s linear infinite;
        pointer-events: none;
    }
    /* ===== วงแสงด้านหลัง ===== */
    .profile-wrap::after {
        content: "";
        position: absolute;
        width: 190px;
        height: 190px;
        top: -20px;
        left: -20px;
        border-radius: 50%;
        background:
            radial-gradient(
                circle,
                rgba(255, 190, 215, 0.20),
                transparent 65%
            );
        animation: glow 3s ease-in-out infinite;
        z-index: -1;
    }
    /* ===== ของตกแต่ง ===== */
    .deco {
        position: absolute;
        z-index: 10;
        pointer-events: none;
        user-select: none;
    }
    /* หัวใจ */
    .heart {
        color: #e58aae;
        text-shadow:
            0 4px 12px
            rgba(229, 138, 174, 0.25);
    }
    /* ดาว */
    .star {
        color: #e58aae;
        text-shadow:
            0 4px 12px
            rgba(229, 138, 174, 0.25);
    }
    /* หัวใจดวงที่ 1 */
    .heart-1 {
        top: 2px;
        right: -30px;
        font-size: 28px;
        animation:
            floatHeart 3s ease-in-out infinite;
    }
    /* หัวใจดวงที่ 2 */
    .heart-2 {
        bottom: 8px;
        left: -28px;
        font-size: 22px;
        animation:
            floatHeart2 3.5s ease-in-out infinite;
    }
    /* ดาวดวงที่ 1 */
    .star-1 {
        top: 32px;
        left: -32px;
        font-size: 23px;
        animation:
            twinkle 2s ease-in-out infinite;
    }
    /* ดาวดวงที่ 2 */
    .star-2 {
        bottom: -10px;
        right: 5px;
        font-size: 19px;
        animation:
            twinkle 2.3s ease-in-out infinite 0.5s;
    }
    /* ประกาย */
    .sparkle-1 {
        top: -13px;
        right: 20px;
        color: #f0a2bf;
        font-size: 17px;
        animation:
            twinkle 1.8s ease-in-out infinite 0.3s;
    }
    .sparkle-2 {
        bottom: 35px;
        right: -37px;
        color: #f0a2bf;
        font-size: 14px;
        animation:
            twinkle 2.4s ease-in-out infinite 0.8s;
    }
    .sparkle-3 {
        top: 65px;
        left: -43px;
        color: #e58aae;
        font-size: 11px;
        animation:
            twinkle 2.1s ease-in-out infinite 0.6s;
    }
    /* ===== Animation ===== */
    @keyframes profileFloat {
        0%,
        100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-6px);
        }
    }
    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    @keyframes glow {
        0%,
        100% {
            opacity: 0.5;
            transform: scale(0.95);
        }
        50% {
            opacity: 1;
            transform: scale(1.05);
        }
    }
    @keyframes floatHeart {
        0%,
        100% {
            transform:
                translate(0, 0)
                rotate(-8deg);
        }
        50% {
            transform:
                translate(5px, -10px)
                rotate(8deg);
        }
    }
    @keyframes floatHeart2 {
        0%,
        100% {
            transform:
                translate(0, 0)
                rotate(8deg);
        }
        50% {
            transform:
                translate(-5px, -8px)
                rotate(-8deg);
        }
    }
    @keyframes twinkle {
        0%,
        100% {
            opacity: 0.4;
            transform:
                scale(0.8)
                rotate(0deg);
        }
        50% {
            opacity: 1;
            transform:
                scale(1.25)
                rotate(15deg);
        }
    }
    /* ===== Text ===== */
    h1 {
        font-size: 42px;
        margin-bottom: 15px;
        color: #6b4055;
    }
    h1 span {
        color: #d96f9f;
        text-shadow:
            0 0 15px
            rgba(217, 111, 159, 0.25);
    }
    .intro {
        color: #806674;
        font-size: 18px;
        line-height: 1.8;
        margin-bottom: 25px;
    }
    .interest {
        color: #b85f87;
        font-size: 17px;
        margin-bottom: 20px;
    }
    .goal {
        color: #d96899;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    /* ===== Button ===== */
    .button {
        display: inline-block;
        background: #e58aae;
        color: #ffffff;
        padding: 13px 30px;
        text-decoration: none;
        border-radius: 12px;
        font-weight: bold;
        box-shadow:
            0 8px 25px
            rgba(220, 120, 160, 0.25);
        transition: 0.3s;
    }
    .button:hover {
        background: #f0b0c8;
        color: #6b4055;
        transform: translateY(-4px);
        box-shadow:
            0 12px 30px
            rgba(220, 120, 160, 0.3);
    }
    /* ===== Small Text ===== */
    .small {
        margin-top: 25px;
        color: #a6788d;
        font-size: 13px;
    }
    /* ===== Mobile ===== */
    @media (max-width: 600px) {
        body {
            padding: 20px;
        }
        .card {
            padding: 40px 22px;
        }
        .profile-wrap {
            width: 135px;
            height: 135px;
        }
        .profile {
            width: 135px;
            height: 135px;
        }
        .profile-wrap::before {
            width: 157px;
            height: 157px;
            top: -11px;
            left: -11px;
        }
        .heart-1 {
            right: -25px;
        }
        .heart-2 {
            left: -24px;
        }
        .star-1 {
            left: -27px;
        }
        .sparkle-2 {
            right: -30px;
        }
        h1 {
            font-size: 34px;
        }
        .intro {
            font-size: 16px;
        }
        .interest,
        .goal {
            font-size: 15px;
        }
    }
</style>
</head>
