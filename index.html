<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | หน้าแรก</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dcd6ff, #f7e8ff);
            color: #333;
        }

        .home {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 50px;
            border-radius: 25px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .profile {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #7657ff;
            margin-bottom: 20px;
        }

        h1 {
            color: #6345e8;
            font-size: 45px;
            margin: 10px 0;
        }

        h2 {
            font-weight: normal;
            color: #666;
        }

        p {
            color: #666;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: #6345e8;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn:hover {
            background: #472cc5;
        }
    </style>
</head>

<body>

    <div class="home">

        <div class="box">

            <!-- ใส่รูปของตัวเองได้ -->
            <img src="profile.jpg" class="profile" alt="รูปของฉัน">

            <h1>สวัสดีค่ะ 👋</h1>

            <h2>ยินดีต้อนรับสู่ Portfolio ของฉัน</h2>

            <p>
                สวัสดีค่ะ หนูชื่อ <b>ธัญวรัตม์ วิการะโพธิ์</b>
                <br>
                เว็บไซต์นี้จัดทำขึ้นเพื่อรวบรวม
                ผลงาน กิจกรรม และประวัติของหนู
            </p>

            <!-- ปุ่มไปหน้าถัดไป -->
            <a href="portfolio.html" class="btn">
                เข้าสู่ Portfolio →
            </a>

        </div>

    </div>

</body>
</html>
