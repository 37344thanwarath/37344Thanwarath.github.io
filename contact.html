<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanwarath | ติดต่อ</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #ffe0ed, transparent 45%),
            radial-gradient(circle at bottom right, #fff0f6, transparent 45%),
            linear-gradient(135deg, #ffd1e2, #fff5f9);
        color: #6b4055;
    }
    /* ================= NAVBAR ================= */
    nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(235, 150, 185, 0.5);
    }
    .logo {
        font-size: 25px;
        font-weight: bold;
        color: #d96f9f;
    }
    .nav-links {
        display: flex;
        gap: 25px;
    }
    .nav-links a {
        text-decoration: none;
        color: #b85f87;
        font-weight: bold;
        transition: 0.3s;
    }
    .nav-links a:hover {
        color: #d34f89;
        transform: translateY(-2px);
    }
    /* ================= CONTAINER ================= */
    .container {
        width: 90%;
        max-width: 900px;
        margin: 55px auto;
    }
    /* ================= CARD ================= */
    .card {
        background: rgba(255, 255, 255, 0.88);
        border: 2px solid #f3b6cf;
        border-radius: 28px;
        padding: 45px 35px;
        box-shadow:
            0 20px 50px rgba(220, 120, 160, 0.18);
    }
    /* ================= TITLE ================= */
    .section-title {
        text-align: center;
        margin-bottom: 35px;
    }
    .section-title .number {
        display: block;
        font-size: 18px;
        font-weight: bold;
        color: #e58aae;
        margin-bottom: 8px;
    }
    .section-title h1 {
        font-size: 40px;
        color: #c85e8d;
        margin-bottom: 10px;
    }
    .section-title p {
        color: #ad718c;
        font-size: 17px;
    }
    /* ================= CONTACT ================= */
    .contact-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .contact-item {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 22px;
        background: rgba(255, 241, 247, 0.9);
        border: 2px solid #f3c4d8;
        border-radius: 20px;
        transition: 0.3s;
    }
    .contact-item:hover {
        transform: translateY(-4px);
        box-shadow:
            0 12px 25px rgba(220, 120, 160, 0.15);
    }
    .contact-icon {
        width: 55px;
        height: 55px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        background: white;
        border-radius: 16px;
        font-size: 27px;
        box-shadow:
            0 5px 15px rgba(220, 120, 160, 0.12);
    }
    .contact-text h2 {
        font-size: 19px;
        color: #c85e8d;
        margin-bottom: 5px;
    }
    .contact-text p {
        color: #987080;
        line-height: 1.6;
    }
    .contact-text a {
        color: #c85e8d;
        text-decoration: none;
        font-weight: bold;
    }
    .contact-text a:hover {
        text-decoration: underline;
    }
    /* ================= PAGE NAVIGATION ================= */
    .page-navigation {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-top: 35px;
    }
    .page-navigation a {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 58px;
        padding: 15px 25px;
        background: rgba(255, 255, 255, 0.88);
        border: 2px solid #f3b6cf;
        border-radius: 20px;
        color: #c85e8d;
        text-decoration: none;
        font-weight: bold;
        font-size: 17px;
        box-shadow:
            0 8px 20px rgba(220, 120, 160, 0.15);
        transition: 0.3s;
    }
    .page-navigation a:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.98);
        box-shadow:
            0 14px 28px rgba(220, 120, 160, 0.23);
    }
    /* ================= FOOTER ================= */
    footer {
        text-align: center;
        padding: 30px 20px;
        color: #a6788d;
        font-size: 14px;
    }
    /* ================= RESPONSIVE ================= */
    @media (max-width: 700px) {
        nav {
            padding: 15px 5%;
        }
        .nav-links {
            gap: 12px;
        }
        .nav-links a {
            font-size: 13px;
        }
        .container {
            width: 92%;
            margin: 35px auto;
        }
        .card {
            padding: 35px 20px;
        }
        .section-title h1 {
            font-size: 32px;
        }
        .contact-item {
            padding: 18px;
        }
        .page-navigation {
            flex-direction: column;
        }
        .page-navigation a {
            width: 100%;
        }
    }
</style>
</head>

    <!-- ================= PAGE NAVIGATION ================= -->
